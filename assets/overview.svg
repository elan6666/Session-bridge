<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">SessionBridge collaboration overview</title><desc id="desc">A main session delegates through a local bridge; worker and supervisor sessions return results for verification.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d32"/><stop offset="1" stop-color="#080f1b"/></linearGradient><linearGradient id="accent"><stop stop-color="#5ae0d0"/><stop offset="1" stop-color="#69abff"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 H 0 V 36" fill="none" stroke="#86a8d8" stroke-opacity=".055"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#63cfca" stroke-width="1.6"/></marker></defs><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect width="1200" height="680" rx="24" fill="url(#bg)"/><rect width="1200" height="680" rx="24" fill="url(#grid)"/><text x="48" y="47" font-size="12" fill="#75dcd1" font-weight="650" letter-spacing="2">SESSIONBRIDGE / OVERVIEW</text><text x="48" y="91" font-size="32" fill="#f3f7ff" font-weight="650" >Your sessions. One collaboration layer.</text><text x="48" y="122" font-size="17" fill="#9bb1ce" font-weight="400" >Sessions stay in their own apps. Models and tools run there, too.</text><rect x="48" y="210" width="282" height="184" rx="16" fill="#111f34" stroke="#263a55"/><rect x="410" y="168" width="370" height="268" rx="16" fill="#112a38" stroke="#367078"/><rect x="858" y="174" width="294" height="158" rx="16" fill="#111f34" stroke="#263a55"/><rect x="858" y="362" width="294" height="158" rx="16" fill="#111f34" stroke="#263a55"/><text x="72" y="245" font-size="12" fill="#85a7ce" font-weight="650" letter-spacing="1.5">MAIN SESSION</text><text x="72" y="282" font-size="28" fill="#f0f6ff" font-weight="650" >Codex</text><text x="72" y="317" font-size="16" fill="#acbfd9" font-weight="400" >Plan · delegate · set scope</text><text x="72" y="346" font-size="16" fill="#acbfd9" font-weight="400" >Verify results · continue</text><text x="436" y="205" font-size="12" fill="#75dcd1" font-weight="650" letter-spacing="1.5">LOCAL COORDINATION</text><text x="436" y="246" font-size="30" fill="#effaff" font-weight="650" >SessionBridge</text><circle cx="440" cy="279" r="3" fill="#66d9cb"/><text x="453" y="285" font-size="16" fill="#bfd5e2" font-weight="400" >Skills → CLI / MCP</text><circle cx="440" cy="316" r="3" fill="#66d9cb"/><text x="453" y="322" font-size="16" fill="#bfd5e2" font-weight="400" >Session identity &amp; delivery ledger</text><circle cx="440" cy="353" r="3" fill="#66d9cb"/><text x="453" y="359" font-size="16" fill="#bfd5e2" font-weight="400" >Run checks &amp; event notifications</text><circle cx="440" cy="390" r="3" fill="#66d9cb"/><text x="453" y="396" font-size="16" fill="#bfd5e2" font-weight="400" >Result return &amp; artifact hashes</text><text x="882" y="209" font-size="12" fill="#85a7ce" font-weight="650" letter-spacing="1.5">WORKER SESSION</text><text x="882" y="248" font-size="23" fill="#f0f6ff" font-weight="650" >Claude Code · Pi · dsh</text><text x="882" y="282" font-size="16" fill="#acbfd9" font-weight="400" >Execute tasks. Submit artifacts.</text><text x="882" y="397" font-size="12" fill="#85a7ce" font-weight="650" letter-spacing="1.5">SUPERVISOR SESSION</text><text x="882" y="436" font-size="23" fill="#f0f6ff" font-weight="650" >Hermes · Codex</text><text x="882" y="470" font-size="16" fill="#acbfd9" font-weight="400" >Check runs. Report outcomes.</text><g fill="none" stroke="#63cfca" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M342 302H397"/><path d="M792 251H845"/><path d="M792 396H816Q826 396 826 406V432Q826 442 836 442H845"/></g><rect x="410" y="478" width="370" height="65" rx="13" fill="#0d1b2a" stroke="#263d51"/><path d="M595 439V465" fill="none" stroke="#4d7a8f" stroke-width="2" marker-end="url(#arrow)"/><text x="434" y="505" font-size="16" fill="#b4cadf" font-weight="550" >SQLite · local task &amp; receipt storage</text><text x="434" y="527" font-size="13" fill="#7f9cbb" font-weight="400" >Persistent records for reconciliation</text><path d="M48 570H1152" stroke="#24364d"/><text x="48" y="610" font-size="17" fill="#c3d5e8" font-weight="550" >01 Connect</text><text x="305" y="610" font-size="17" fill="#c3d5e8" font-weight="550" >02 Delegate</text><text x="563" y="610" font-size="17" fill="#c3d5e8" font-weight="550" >03 Supervise &amp; return</text><text x="907" y="610" font-size="17" fill="#c3d5e8" font-weight="550" >04 Verify in main</text><text x="48" y="648" font-size="13" fill="#8098b6" font-weight="400" >Illustrative roles. Supported modes and versions vary by connector.</text></g></svg>